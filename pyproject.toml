[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platmon-hub"
dynamic = ["version"]
description = "Read-only fleet monitoring for independent platmon agents"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []
keywords = ["monitoring", "fleet", "platmon", "jetson", "raspberry-pi"]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/platmon/platmon-hub"
Documentation = "https://github.com/platmon/platmon-hub/blob/main/docs/README.md"
Changelog = "https://github.com/platmon/platmon-hub/blob/main/CHANGELOG.md"
Issues = "https://github.com/platmon/platmon-hub/issues"

[project.scripts]
platmon-hub = "hub.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "hub.__version__"}

[tool.setuptools.packages.find]
include = ["hub", "hub.*"]

[tool.setuptools.package-data]
hub = ["web/*.html", "web/*.css", "web/*.js", "web/assets/brand/*.svg"]

[tool.setuptools.data-files]
"share/platmon-hub/deploy" = ["deploy/platmon-hub.service", "deploy/platmon-hub-user.service", "deploy/hub.env.example", "deploy/install-windows-task.ps1", "deploy/start-windows.ps1", "deploy/install-windows-startup.ps1", "deploy/nginx.conf.example"]

"share/platmon-hub" = ["nodes.example.json", "alerts.example.json", "CHANGELOG.md", "README.md", "backend.md", "LICENSE"]
"share/platmon-hub/docs" = ["docs/*.md"]
"share/platmon-hub/docs/guides" = ["docs/guides/*.md"]
"share/platmon-hub/docs/design" = ["docs/design/*.md"]
"share/platmon-hub/docs/design/adr" = ["docs/design/adr/*.md"]
"share/platmon-hub/docs/development" = ["docs/development/*.md"]
"share/platmon-hub/docs/development/benchmarks" = ["docs/development/benchmarks/*.md", "docs/development/benchmarks/*.json", "docs/development/benchmarks/*.png"]
