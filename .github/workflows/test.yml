name: test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hub tests
      - name: Check browser JavaScript syntax
        run: |
          node --check hub/web/app.js
          node --check hub/web/devices.js
          node --check hub/web/data.js
      - name: Synthetic fleet harness smoke (loopback only)
        run: python scripts/benchmark-fleet.py --nodes 10 --seconds 3 --output "${{ runner.temp }}/synthetic-smoke.json"
      - name: Long-soak reporting smoke (loopback only)
        run: python scripts/soak-fleet.py --synthetic 10 --seconds 10 --window-seconds 2 --output "${{ runner.temp }}/soak-smoke.json"
      - name: Build and install isolated wheel
        run: python scripts/check-package.py --output-dir "${{ runner.temp }}/candidate-artifacts"
      - name: Validate systemd example syntax
        if: runner.os == 'Linux'
        run: python scripts/check-service.py
      - name: Validate local TLS authentication proxy
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          sudo apt-get update -qq
          mkdir -p "$RUNNER_TEMP/nginx-check"
          pushd "$RUNNER_TEMP/nginx-check"
          apt-get download nginx
          dpkg-deb -x ./*.deb extracted
          popd
          python scripts/check-proxy.py --nginx "$RUNNER_TEMP/nginx-check/extracted/usr/sbin/nginx"
      - name: Validate Windows launch and startup scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-launcher.ps1
      - name: Windows loopback soak harness smoke (no device targets)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = (Get-Command python).Source
          $server = Start-Process -FilePath $binary -ArgumentList @("-m", "hub", "--nodes", "nodes.example.json", "--port", "9787") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($server.HasExited) { throw "Hub exited before healthy" }
              try {
                $result = Invoke-RestMethod "http://127.0.0.1:9787/healthz" -TimeoutSec 1
                if ($result.status -eq "ok") { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Hub did not become healthy" }
            $outDir = Join-Path $env:RUNNER_TEMP "soak-smoke"
            ./scripts/soak-windows.ps1 -HubPid $server.Id -DurationSeconds 4 -SampleIntervalSeconds 1 -ExpectedNodeCount 0 -OutputDirectory $outDir
            $summaryPath = @(Get-ChildItem $outDir -Filter "*-summary.json")[0].FullName
            $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
            if (-not $summary.passed -or
                $null -eq $summary.hub_cpu_mean_percent_one_core -or
                $null -eq $summary.hub_cpu_total_seconds_between_samples -or
                $null -eq $summary.hub_rss_first_mib -or
                $null -eq $summary.hub_rss_last_mib) {
              throw "Windows soak summary is incomplete"
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
