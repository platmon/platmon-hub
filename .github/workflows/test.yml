name: test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hub tests
      - name: Check browser JavaScript syntax
        run: node --check hub/web/app.js
      - name: Build and install isolated wheel
        run: python scripts/check-package.py
      - name: Validate systemd example syntax
        if: runner.os == 'Linux'
        run: python scripts/check-service.py
      - name: Validate Windows task script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path deploy/install-windows-task.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Windows loopback soak harness smoke (no device targets)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = (Get-Command python).Source
          $server = Start-Process -FilePath $binary -ArgumentList @("-m", "hub", "--nodes", "nodes.example.json", "--port", "9787") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($server.HasExited) { throw "Hub exited before healthy" }
              try {
                $result = Invoke-RestMethod "http://127.0.0.1:9787/healthz" -TimeoutSec 1
                if ($result.status -eq "ok") { $ready = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Hub did not become healthy" }
            $outDir = Join-Path $env:RUNNER_TEMP "soak-smoke"
            ./scripts/soak-windows.ps1 -HubPid $server.Id -DurationSeconds 4 -SampleIntervalSeconds 1 -ExpectedNodeCount 0 -OutputDirectory $outDir
            $summaryPath = @(Get-ChildItem $outDir -Filter "*-summary.json")[0].FullName
            $summary = Get-Content $summaryPath -Raw | ConvertFrom-Json
            if (-not $summary.passed -or
                $null -eq $summary.hub_cpu_mean_percent_one_core -or
                $null -eq $summary.hub_cpu_total_seconds_between_samples -or
                $null -eq $summary.hub_rss_first_mib -or
                $null -eq $summary.hub_rss_last_mib) {
              throw "Windows soak summary is incomplete"
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
